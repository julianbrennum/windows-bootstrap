# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# Desktop-only apps (8K-WORKSTATION). Common apps are in winget-base.dsc.yaml.

properties:
  configurationVersion: 0.2.0
  resources:

    # --- Dev tools ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: CMake
      settings: { id: Kitware.CMake, source: winget }

    # --- Productivity ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: MPCbe
      settings: { id: MPC-BE.MPC-BE, source: winget }

    # --- Audio / creative ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Rekordbox
      settings: { id: AlphaTheta.rekordbox, source: winget }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Affinity
      settings: { id: Canva.Affinity, source: winget }

    # --- Gaming ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: EpicGames
      settings: { id: EpicGames.EpicGamesLauncher, source: winget }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Rockstar
      settings: { id: RockstarGames.Launcher, source: winget }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Playnite
      settings: { id: Playnite.Playnite, source: winget }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: GameInput
      settings: { id: Microsoft.GameInput, source: winget }

    # --- Peripherals ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: StreamDeck
      settings: { id: Elgato.StreamDeck, source: winget }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: SteelSeriesGG
      settings: { id: SteelSeries.GG, source: winget }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: SignalRGB
      settings: { id: WhirlwindFX.SignalRgb, source: winget }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: LGTVCompanion
      settings: { id: JPersson77.LGTVCompanion, source: winget }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: HueSync
      settings: { id: Philips.HueSync, source: winget }
