# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# WinGet Configuration — declarative app installs + optional Windows tweaks.
# Apply: winget configure --file packages\winget.dsc.yaml --accept-configuration-agreements
# Rule: each app lives in exactly one manager (winget / scoop / choco). No duplicates.

properties:
  configurationVersion: 0.2.0
  resources:

    # --- Dev tools ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Git
      settings: { id: Git.Git, source: winget }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: GitHubCLI
      settings: { id: GitHub.cli, source: winget }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: PowerShell
      settings: { id: Microsoft.PowerShell, source: winget }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Go
      settings: { id: GoLang.Go, source: winget }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: NodeJS
      settings: { id: OpenJS.NodeJS, source: winget }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Python
      settings: { id: Python.Python.3.14, source: winget }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: PythonLauncher
      settings: { id: Python.Launcher, source: winget }
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Rustup
      settings: { id: Rustlang.Rustup, source: winget }
